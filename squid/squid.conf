# Egress proxy for the "agent" (internal) network -> "egress"
http_port 3128

# Private networks (includes the docker "agent" network)
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny manager
# Mode-specific rules generated by entrypoint.sh from SANDBOX_PROXY_MODE:
# audit allows localnet to any destination, strict only to allowed-domains.txt
include /etc/squid/sandbox-mode.conf
http_access deny all

# No disk cache, filtering proxy only
cache deny all
cache_mem 0 MB

# Do not disclose the client IP
forwarded_for delete
via off

# Logs are tailed to stdout by the image entrypoint
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

shutdown_lifetime 1 seconds
