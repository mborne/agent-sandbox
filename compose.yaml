services:
  sandbox:
    build: ./opencode
    # Web mode (`opencode serve`); the CLI also works with `docker compose exec sandbox opencode`.
    # Password: OPENCODE_SERVER_PASSWORD (e.g. in .env), otherwise generated; read it with `web-credentials`.
    # OPENCODE_SERVER_ENABLED=0 disables web mode (the container stays idle)
    entrypoint: ["sandbox-entrypoint"]
    environment:
      OPENCODE_SERVER_ENABLED: ${OPENCODE_SERVER_ENABLED:-1}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy
      no_proxy: localhost,127.0.0.1,proxy
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - data:/home/ubuntu/workspace
      # ~/.config (opencode.json, written by setup-albert) and ~/.local (opencode
      # credentials and sessions, prompt history, tree-sitter grammars, user tools)
      - config:/home/ubuntu/.config
      - local:/home/ubuntu/.local
    networks:
      - agent
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    image: ubuntu/squid:latest
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      - agent
      - egress
    restart: unless-stopped

  # Web mode: relays the host loopback to `opencode serve` (see docs/web-mode.md);
  # the sandbox is on an internal network, where Docker cannot publish ports
  web:
    image: nginx:alpine
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:4096:4096"
    networks:
      - agent
      - web
    depends_on:
      - sandbox
    restart: unless-stopped

volumes:
  data:
    name: opencode-data
  config:
    name: opencode-config
  local:
    name: opencode-local

networks:
  agent:
    internal: true
  egress:
  # Only used to publish the web relay port on the host
  web:
