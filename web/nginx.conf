# Relay from the host loopback to `opencode serve` in the sandbox.
# The sandbox is only on the internal "agent" network, where Docker cannot publish ports.
server {
    listen 4096;

    location / {
        proxy_pass http://sandbox:4096;
        proxy_http_version 1.1;
        # WebSocket upgrade (terminal) and server-sent events (session updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
