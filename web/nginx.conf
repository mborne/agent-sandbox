# Relay from the host loopback to the web UI of the sandbox (opencode serve, ttyd
# or code-server).
# The sandbox is only on the internal "agent" network, where Docker cannot publish ports.
server {
    listen 4096;

    location / {
        proxy_pass http://sandbox:4096;
        proxy_http_version 1.1;
        # WebSocket upgrade (terminal) and server-sent events (session updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # With the port: code-server checks the WebSocket Origin against it
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
